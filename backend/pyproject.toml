[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tridefense-backend"
version = "0.1.0"
description = "Tri-Defense local P0 submission and registry API; no inference"
requires-python = ">=3.11"
dependencies = ["web3==7.13.0"]

[project.scripts]
tridefense-backend = "tridefense_backend.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tridefense_backend*"]
